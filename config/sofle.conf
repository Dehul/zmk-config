# Uncomment the following line to enable the Sofle OLED Display
CONFIG_ZMK_DISPLAY=y

# Uncomment these two lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment this line below to add rgb underglow / backlight support
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_EXT_POWER=y

# Enable idle + sleep behavior
# 5 minutes before entering idle state (turn underglow off)
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_SLEEP=y
# 15 minutes before entering deep sleep
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Leave soft-off disabled so the board powers on normally when the switch is on
# CONFIG_ZMK_PM_SOFT_OFF=y

# Uncomment the line below to enable split BLE central battery level proxying and fetching.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
